<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Baby Dash</title>
<meta name="description" content="Baby Dash - เกมวิ่งเด็กน้อยสุดน่ารัก กระโดด สไลด์ เก็บนม บน Android">
<link rel="icon" href="icon.png">
<style>
  :root { --bg: #fff6e6; --card: #ffffff; --text: #3b2a1e; --muted: #7a6656; --accent: #e8892a; --button: #3dbe4e; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1f1a16; --card: #2a231d; --text: #f3e9dc; --muted: #b8a796; --accent: #f4a54a; --button: #3dbe4e; }
  }
  body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.6 system-ui, -apple-system, "Segoe UI", "Noto Sans Thai", sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 48px 16px; text-align: center; }
  img.icon { width: 128px; height: 128px; border-radius: 28px; box-shadow: 0 6px 20px rgba(0, 0, 0, .15); }
  h1 { font-size: 2.2rem; margin: 20px 0 4px; color: var(--accent); }
  p { margin: 8px 0; }
  .muted { color: var(--muted); }
  a.play { display: inline-block; margin: 24px 0; padding: 12px 28px; border-radius: 999px; background: var(--button);
    color: #fff; font-weight: 700; text-decoration: none; }
  footer { margin-top: 32px; font-size: .9rem; color: var(--muted); }
  footer a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <img class="icon" src="icon.png" alt="Baby Dash">
  <h1>Baby Dash</h1>
  <p>เกมวิ่งเด็กน้อยสุดน่ารัก กระโดด สไลด์ เก็บนม ผ่าน 10 ด่าน</p>
  <p class="muted">A cute endless runner: jump, slide and collect milk through 10 levels.</p>
  <a class="play" href="https://play.google.com/store/apps/details?id=io.kitti.chim.babydash">Google Play</a>
  <footer>
    <p><a href="privacy.html">นโยบายความเป็นส่วนตัว / Privacy Policy</a></p>
    <p>ติดต่อ / Contact: <a href="mailto:babydash.support@gmail.com">babydash.support@gmail.com</a></p>
    <p>© 2026 Kitti Chimmawan</p>
  </footer>
</main>
</body>
</html>
